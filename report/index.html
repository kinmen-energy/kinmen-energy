<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金門節能資訊平台</title>
<style>
  :root{
    --teal-900:#0a565e; --teal-700:#0d7079; --teal-500:#17a2ad; --teal-100:#dceef0;
    --stone:#e9dcc4; --sand:#d9a441; --paper:#eef3f3; --ink:#20302f; --ink-soft:#5f6f6d;
    --orange:#ef7f1a; --line:#e3e9e9; --card:#fff;
    --shadow:0 3px 16px rgba(20,60,60,.08);
    --t-jinning:#2b9aa3; --t-jinsha:#0d7079; --t-jinhu:#e0824a; --t-jincheng:#d9a441; --t-lieyu:#7cc0a6;
    --sidebar-w:236px; --sidebar-w-collapsed:66px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    background:var(--paper);color:var(--ink);line-height:1.75;overflow-x:hidden;font-size:17px}

  /* 頂列 */
  .topbar{height:60px;background:linear-gradient(135deg,var(--teal-900),var(--teal-700));
    color:#fff;display:flex;align-items:center;gap:14px;padding:0 20px;position:sticky;top:0;z-index:30;
    box-shadow:0 2px 10px rgba(10,50,50,.15)}
  .topbar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;
    background:linear-gradient(90deg,var(--orange),#f6b352)}
  .burger{background:rgba(255,255,255,.14);border:none;color:#fff;width:38px;height:38px;
    border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
  .burger:hover{background:rgba(255,255,255,.24)}
  .brand{display:flex;align-items:center;gap:10px}
  .brand .mark{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.14);
    display:flex;align-items:center;justify-content:center}
  .brand h1{font-size:22px;font-weight:800;letter-spacing:.05em}
  .brand .sub{font-size:12.5px;opacity:.8;letter-spacing:.16em}
  .topbar .spacer{flex:1}
  .demo-pill{font-size:13px;background:rgba(255,255,255,.16);padding:5px 11px;border-radius:20px;letter-spacing:.08em}

  .app{display:flex;min-height:calc(100vh - 60px)}

  /* 側欄 */
  .sidebar{width:var(--sidebar-w);background:#fff;border-right:1px solid var(--line);
    padding:16px 12px;transition:width .22s ease;flex:none;position:sticky;top:60px;height:calc(100vh - 60px)}
  .sidebar .grp{font-size:12.5px;color:var(--ink-soft);letter-spacing:.16em;padding:10px 12px 6px;font-weight:600}
  .nav a,.nav .navitem{display:flex;align-items:center;gap:12px;padding:13px 12px;border-radius:11px;
    text-decoration:none;color:var(--ink);font-size:16.5px;font-weight:600;margin-bottom:3px;white-space:nowrap;
    cursor:pointer;transition:background .15s}
  .nav a:hover{background:var(--teal-100)}
  .nav a.active{background:var(--teal-900);color:#fff}
  .nav .navitem.soon{color:#a7b3b2;cursor:default}
  .nav .ic{width:22px;height:22px;flex:none;display:flex;align-items:center;justify-content:center}
  .nav .lbl{flex:1}
  .nav .tag{font-size:11.5px;background:#f0ece0;color:#8a7a50;padding:2px 7px;border-radius:10px}
  .nav a.active .tag{background:rgba(255,255,255,.2);color:#fff}
  /* 收合狀態 */
  .app.collapsed .sidebar{width:var(--sidebar-w-collapsed)}
  .app.collapsed .sidebar .lbl,.app.collapsed .sidebar .tag,.app.collapsed .sidebar .grp{display:none}
  .app.collapsed .nav a,.app.collapsed .nav .navitem{justify-content:center;padding:11px 0}

  /* 主內容 */
  .content{flex:1;padding:16px;display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
  .card .hd{padding:16px 20px 0}
  .card .hd h2{font-size:19px;font-weight:800;letter-spacing:.04em;color:var(--teal-900)}
  .card .hd .sub{font-size:14px;color:var(--ink-soft);margin-top:2px}

  /* 地圖卡 */
  .mapcard .body{padding:6px 12px 12px}
  .map-wrap{position:relative}
  svg.kinmen{width:100%;height:auto;max-height:420px;display:block;overflow:visible}
  /* 讓地圖與下方統計列的左右邊界一致 */
  .mapcard .map-wrap{margin:0}
  .mapcard .body{padding-left:14px;padding-right:14px}
  .region{cursor:pointer;
    transition:transform .28s cubic-bezier(.34,1.4,.5,1), filter .28s ease, stroke-width .28s ease;
    transform-origin:center center;transform-box:fill-box;
    stroke:#fff;stroke-width:2.5px;
    filter:drop-shadow(0 2px 3px rgba(10,60,60,.20));}
  .region:hover{
    transform:translateY(-11px) scale(1.075);
    stroke-width:3.5px;
    filter:
      drop-shadow(0 14px 16px rgba(10,60,60,.32))
      drop-shadow(0 4px 5px rgba(10,60,60,.20))
      brightness(1.07) saturate(1.06);}
  .region-label{font-size:15px;font-weight:800;fill:#fff;pointer-events:none;
    paint-order:stroke;stroke:rgba(0,0,0,.12);stroke-width:.6px}
  .marker{fill:var(--orange);stroke:#fff;stroke-width:2}
  .marker-pulse{fill:var(--orange);opacity:.35;animation:pulse 2s ease-out infinite}
  @keyframes pulse{0%{r:5;opacity:.4}100%{r:16;opacity:0}}
  .tooltip{position:absolute;pointer-events:none;background:var(--teal-900);color:#fff;
    padding:7px 11px;border-radius:8px;font-size:12.5px;opacity:0;transition:opacity .12s;
    transform:translate(-50%,-115%);white-space:nowrap;z-index:5;box-shadow:0 4px 12px rgba(0,0,0,.2)}
  .map-tools{display:flex;align-items:center;gap:14px;padding:2px 0 0;flex-wrap:wrap}
  .toggle{display:flex;align-items:center;gap:7px;font-size:15px;color:var(--ink-soft);cursor:pointer}
  .toggle input{accent-color:var(--orange);width:16px;height:16px}
  .legend{display:flex;flex-wrap:wrap;gap:12px;padding:10px 0 0}
  .legend .li{display:flex;align-items:center;gap:6px;font-size:14.5px}
  .legend .sw{width:13px;height:13px;border-radius:4px}
  .mapstats{display:flex;gap:10px;padding:10px 0 2px}
  .mapstats .s{flex:1;background:var(--teal-100);border-radius:12px;padding:10px;text-align:center}
  .mapstats .s .n{font-size:26px;font-weight:800;color:var(--teal-900)}
  .mapstats .s .l{font-size:13px;color:var(--ink-soft)}

  /* 右欄 */
  .rail{display:flex;flex-direction:column;gap:20px}
  .weather .body{padding:16px 20px 20px;text-align:center}
  .weather .temp{font-size:58px;font-weight:800;color:var(--teal-900);line-height:1}
  .weather .cond{font-size:16px;color:var(--ink-soft);margin-top:2px}
  .weather .sun{width:56px;height:56px;margin:6px auto 4px;color:var(--orange)}
  .weather .meta{display:flex;justify-content:center;gap:18px;margin-top:14px;font-size:14px;color:var(--ink-soft)}
  .weather .meta b{color:var(--ink);font-size:14px;display:block}
  .notice{font-size:12.5px;color:#a99;margin-top:12px}
  .news .body{padding:6px 8px 10px}
  .news .item{display:flex;gap:12px;padding:11px 12px;border-radius:10px;text-decoration:none;color:inherit}
  .news .item:hover{background:var(--teal-100)}
  .news .date{font-size:12.5px;color:var(--ink-soft);flex:none;width:44px;text-align:center;line-height:1.2}
  .news .date b{display:block;font-size:19px;color:var(--teal-700);font-weight:800}
  .news .txt{font-size:15.5px;font-weight:600}
  .news .more{text-align:center;padding:8px;font-size:15px;color:var(--orange);font-weight:700;cursor:pointer}

  @media(max-width:900px){
    .content{grid-template-columns:1fr}
    .sidebar{position:fixed;z-index:25;left:0;box-shadow:4px 0 20px rgba(0,0,0,.12);
      transform:translateX(0);transition:transform .22s}
    .app.collapsed .sidebar{width:var(--sidebar-w);transform:translateX(-100%)}
    .app.collapsed .sidebar .lbl,.app.collapsed .sidebar .tag,.app.collapsed .sidebar .grp{display:block}
    .app.collapsed .nav a,.app.collapsed .nav .navitem{justify-content:flex-start;padding:11px 12px}
  }
</style>
</head>

<script>
/* ── 側欄收合 ── */
function toggleSidebar(){ document.getElementById('app').classList.toggle('collapsed'); }

/* ── 鄉鎮資料（未來由名冊 API 帶入 count；目前示範）── */
const TOWNS = [
  {name:'金城鎮', color:'#e59ab2', count:42},
  {name:'金寧鄉', color:'#5bbcc2', count:31},
  {name:'金湖鎮', color:'#e6a45c', count:28},
  {name:'金沙鎮', color:'#a6c96a', count:19},
  {name:'烈嶼鄉', color:'#ecd18a', count:8},
];

/* ── 已健檢點位（未來由 result 名冊帶入座標；目前示範）── */
const POINTS = [
  {town:'金城鎮', x:247.2, y:373.4},{town:'金城鎮', x:213.2, y:349.4},{town:'金城鎮', x:275.2, y:387.4},
  {town:'金寧鄉', x:297.2, y:266.6},{town:'金寧鄉', x:327.2, y:240.60000000000002},
  {town:'金湖鎮', x:492.6, y:317.7},{town:'金湖鎮', x:452.6, y:299.7},
  {town:'金沙鎮', x:520.5, y:208.9},
  {town:'烈嶼鄉', x:93.9, y:300.4}
];

/* 圖例 */
document.getElementById('legend').innerHTML = TOWNS.map(t=>
  `<div class="li"><span class="sw" style="background:${t.color}"></span>${t.name}　<b style="color:var(--ink-soft)">${t.count}戶</b></div>`
).join('');

/* 統計 */
const total = TOWNS.reduce((a,t)=>a+t.count,0);
document.getElementById('stTotal').textContent = total;
document.getElementById('stWeek').textContent = 6;
document.getElementById('stTowns').textContent = TOWNS.filter(t=>t.count>0).length + '/6';

/* 點位渲染 */
function renderMarkers(){
  const g=document.getElementById('markers');
  g.innerHTML = POINTS.map(p=>
    `<circle class="marker-pulse" cx="${p.x}" cy="${p.y}" r="5"></circle>
     <circle class="marker" cx="${p.x}" cy="${p.y}" r="4.5"></circle>`
  ).join('');
}
renderMarkers();
function toggleMarkers(){
  document.getElementById('markers').style.display =
    document.getElementById('showMarkers').checked ? '' : 'none';
}

/* 鄉鎮 hover tooltip */
const tip=document.getElementById('tip'), wrap=document.querySelector('.map-wrap');
document.querySelectorAll('.region').forEach(r=>{
  r.addEventListener('mousemove', ev=>{
    const town=r.dataset.town;
    const t=TOWNS.find(x=>x.name===town);
    tip.innerHTML = town + (t?`　已健檢 ${t.count} 戶`:'');
    const rect=wrap.getBoundingClientRect();
    tip.style.left=(ev.clientX-rect.left)+'px';
    tip.style.top=(ev.clientY-rect.top)+'px';
    tip.style.opacity=1;
  });
  r.addEventListener('mouseleave', ()=> tip.style.opacity=0);
});

/* 公告示範 */
const NEWS=[
  {d:'27',m:'7月',t:'115年度住商節電輔導開始受理報名'},
  {d:'22',m:'7月',t:'金門縣居家用電健檢服務擴大辦理'},
  {d:'15',m:'7月',t:'節能家電汰換補助說明會通知'},
  {d:'08',m:'7月',t:'夏季用電高峰節電宣導活動'},
];
document.getElementById('newsList').innerHTML = NEWS.map(n=>
  `<a class="item" href="#"><div class="date"><b>${n.d}</b>${n.m}</div><div class="txt">${n.t}</div></a>`
).join('');

/* ── 即時天氣（透過 Apps Script 天氣端點，JSONP）── */
const WEATHER_API = "https://script.google.com/macros/s/AKfycbwH976MlJsdmnY2toxw0-J7xKVz-xMwgZPZI858bhvgnh9qpZi9WzhoWXmf0MxGhLa2/exec";
function setWx(id,v,suffix){ const el=document.getElementById(id); if(el) el.textContent=(v==null||v==='—')?'—':v+(suffix||''); }
window.__onWeather=function(w){
  if(!w||w.error){ document.getElementById('wxSub').textContent='天氣暫時無法取得';
    if(w&&w.error) document.getElementById('wxNote').textContent='＊'+w.error; return; }
  setWx('wxTemp', w.temp);
  document.getElementById('wxCond').textContent = w.condition||'—';
  setWx('wxFeels', w.feels, '°');
  setWx('wxPop', w.pop, '%');
  setWx('wxHum', w.humidity, '%');
  setWx('wxWind', w.wind);
  const time = (w.time||'').replace('T',' ').slice(0,16);
  document.getElementById('wxSub').textContent = (w.town||'金門') + (time?' · '+time:'');
};
(function loadWeather(){
  if(!WEATHER_API){ document.getElementById('wxSub').textContent='未設定天氣來源'; return; }
  const s=document.createElement('script');
  s.src=WEATHER_API+(WEATHER_API.indexOf('?')>-1?'&':'?')+'weather=1&callback=__onWeather';
  s.onerror=()=>{ document.getElementById('wxSub').textContent='天氣連線失敗'; };
  document.body.appendChild(s);
})();
</script>
