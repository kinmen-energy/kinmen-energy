<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金門縣居家節能診斷報告</title>
<style>
  :root{
    --teal:#1aa1ac; --teal-d:#0d7079; --teal-dd:#0a565e; --teal-l:#e5f3f4;
    --yellow:#f4c81e; --orange:#ef7f1a; --red:#e0392a; --good:#2f9e5f;
    --ink:#20302f; --ink-soft:#5f6f6d; --paper:#fff; --line:#e3e9e9;
    --shadow:0 3px 16px rgba(20,60,60,.09);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    background:#e6ecec;color:var(--ink);line-height:1.55;padding:24px 12px}
  .sheet{max-width:820px;margin:0 auto;background:var(--paper);border-radius:8px;
    box-shadow:0 6px 30px rgba(10,50,50,.14);overflow:hidden;padding:26px 30px 0}

  /* 抬頭 */
  .rhead{display:flex;align-items:flex-start;gap:16px;position:relative}
  .rhead .t{flex:1}
  .rhead h1{font-size:27px;font-weight:900;color:var(--teal-dd);letter-spacing:.02em}
  .rhead .meta{margin-top:8px;color:var(--teal-d);font-size:15px;font-weight:600;line-height:1.9}
  .rhead .mascot{width:92px;height:92px;flex:none;border-radius:50%;overflow:hidden;
    display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(20,60,60,.12)}
  .hr{height:5px;background:var(--teal);border-radius:3px;margin:14px 0 20px}

  /* 標籤頁 */
  .tab{display:inline-block;background:var(--teal);color:#fff;font-weight:800;
    padding:6px 22px;border-radius:9px;font-size:16px;letter-spacing:.06em;box-shadow:0 2px 0 rgba(0,0,0,.08)}
  .tab.yellow{background:var(--yellow);color:#5a4a00}
  .tab.sm{font-size:14px;padding:5px 16px}
  .note{display:inline-block;color:var(--red);font-size:12.5px;margin-left:10px;vertical-align:middle}

  /* 版面格 */
  .grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}
  .block{margin-bottom:4px}
  .box{border:2.5px solid var(--teal);border-radius:16px;padding:14px 12px;margin-top:10px;min-height:110px}

  /* 圖示磚 */
  .tiles{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
  .tile{width:92px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 2px;text-align:center}
  .tile .ic{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center}
  .tile.issue .ic{background:#fdeae7;color:var(--red)}
  .tile.ok .ic{background:#e7f4ec;color:var(--good)}
  .tile.info .ic{background:var(--teal-l);color:var(--teal-d)}
  .tile .cap{font-size:12.5px;font-weight:700;line-height:1.25}
  .tile.issue .cap{color:var(--red)} .tile.ok .cap{color:var(--good)}
  .tile .sub{font-size:11px;color:var(--ink-soft)}

  /* 照度場域列 */
  .lux-scale{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:6px 4px 0}
  .lux-node{flex:1;text-align:center}
  .lux-node .dot{width:44px;height:44px;border-radius:50%;margin:0 auto 4px;display:flex;align-items:center;justify-content:center;color:#fff}
  .lux-node .nm{font-size:12px;font-weight:700}
  .lux-node .lx{font-size:11px;color:var(--ink-soft)}

  /* 處方雙欄 */
  .rx{margin:10px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:26px}
  .rx .col{padding:0}
  .rx .ch{display:block;text-align:center;font-size:17px;font-weight:900;letter-spacing:.14em;
    background:var(--yellow);border-radius:22px;padding:7px 0;margin-bottom:14px;
    box-shadow:0 2px 0 rgba(0,0,0,.06)}
  .ch.self{color:var(--orange)} .ch.pro{color:var(--red)}
  .rx ul{list-style:none;padding:0 6px}
  .rx li{display:flex;gap:9px;align-items:flex-start;padding:6px 0;font-size:14.5px}
  .rx li .bul{color:var(--ink);font-weight:900;line-height:1.45;flex:none}
  .rx li.urgent .bul{color:var(--red)}
  .rx li .bang{color:var(--red);font-weight:900}
  .empty{color:var(--ink-soft);font-size:13px;text-align:center;padding:6px}

  /* 底列 */
  .foot{background:var(--teal);color:#fff;margin:22px -30px 0;padding:13px 30px;
    display:flex;align-items:center;justify-content:center;gap:30px;font-size:14px;font-weight:700}
  .foot .it{display:flex;align-items:center;gap:8px}
  .foot .ver{opacity:.7;font-weight:400;font-size:11px;margin-left:auto}

  .printbtn{position:fixed;top:18px;right:18px;z-index:10;background:var(--orange);color:#fff;border:none;
    padding:11px 18px;border-radius:24px;font-size:14px;font-weight:700;cursor:pointer;
    box-shadow:0 4px 14px rgba(239,127,26,.4);font-family:inherit}
  .banner{max-width:820px;margin:0 auto 10px;background:#fff8e6;border:1px solid #f0dca0;color:#8a6a10;padding:8px 14px;border-radius:8px;font-size:13px}
  .state{max-width:820px;margin:60px auto;text-align:center;color:var(--ink-soft)}

  @media(max-width:680px){ .grid{grid-template-columns:1fr} .rx{grid-template-columns:1fr}
    .rx .col:first-child{border-right:none;border-bottom:1px dashed #d8d2c2;padding-bottom:12px}
    .rhead h1{font-size:22px} }
  @media print{ body{background:#fff;padding:0} .sheet{box-shadow:none;max-width:none} .printbtn,.banner{display:none}
    .block,.box,.rx{break-inside:avoid} }
</style>
</head>
<body>
<button class="printbtn" onclick="window.print()">🖨 列印 / 存成 PDF</button>
<div id="banner"></div>
<div class="sheet" id="sheet"><div class="state">載入中…</div></div>

  bulb:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.7 1 1.2 1 2.5h6c0-1.3.2-1.8 1-2.5A6 6 0 0 0 12 3z"/></svg>',

}[name]||ICO.warn);

const esc=s=>String(s==null?"":s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function renderReport(D){
  const b=D.basic||{}, e=D.electricity, det=D.detail||{}, F=D.findings||[];
  const by=dom=>F.filter(f=>f.domain===dom);
  const smile=!e||e.face==="smile";

  /* 磚：一筆 finding → tile */
  const tile=f=>`<div class="tile issue"><div class="ic">${iconFor(f.icon)}</div>
     <div class="cap">${esc(f.status||f.item)}</div></div>`;
  const okTile=txt=>`<div class="tile ok"><div class="ic">${ICO.check}</div><div class="cap">${txt}</div></div>`;
  const tilesOf=(arr,okTxt)=> `<div class="tiles">${arr.length?arr.map(tile).join(""):okTile(okTxt||"檢查正常")}</div>`;

  /* 照度場域 */
  const zones=det.illuminance||[];
  const luxRow = zones.length? `<div class="lux-scale">${zones.map(z=>{
    const ok=z.status==="正常"; const col=ok?"var(--good)":"var(--red)";
    return `<div class="lux-node"><div class="dot" style="background:${col}">${ICO.bulb}</div>
      <div class="nm" style="color:${col}">${esc(z.zone)}</div>
      <div class="lx">${z.measured} Lux</div>
      <div class="lx" style="color:${col};font-weight:700">${esc(z.status)}</div></div>`;
  }).join("")}</div>` : `<div class="empty">照度未量測</div>`;

  /* 冷氣（含熱像異常一起當磚）*/
  const acAll=by("冷氣");
  /* 冰箱 / 冷凍櫃 */
  const friAll=by("冰箱");
  const freezerAll=F.filter(f=>f.domain==="冷凍櫃");
  /* 其他：其他/熱水器/現場 */
  const otherAll=F.filter(f=>["其他","熱水器","現場"].includes(f.domain));

  /* 處方 */
  const challenge=F.filter(f=>f.category==="challenge").sort((a,b)=>(b.priority==="urgent")-(a.priority==="urgent"));
  const rescue=F.filter(f=>f.category==="rescue").sort((a,b)=>(b.priority==="urgent")-(a.priority==="urgent"));
  const li=f=>`<li class="${f.priority==="urgent"?'urgent':''}"><span class="bul">${f.priority==="urgent"?'<span class="bang">❗</span>':'●'}</span><span>${esc(f.message)}</span></li>`;
  const rxCol=(arr,cls,title)=>`<div class="col ${cls}"><div class="ch ${cls}">${title}</div>
     ${arr.length?`<ul>${arr.map(li).join("")}</ul>`:'<div class="empty">此次無此類建議</div>'}</div>`;

  const html=`
  <div class="rhead">
    <div class="t">
      <h1>金門縣居家節能診斷報告</h1>
      <div class="meta">住戶姓名：${esc(b.resident_name)}<br>房屋類型：${esc(b.house_type)}<br>診斷日期：${esc(b.inspect_date)}</div>
    </div>
    <div class="mascot">${MASCOT(smile)}</div>
  </div>
  <div class="hr"></div>

  <div class="grid">
    <!-- 左：照度 -->
    <div class="block">
      <span class="tab">照度</span><span class="note">紅色：照度不足或過高</span>
      <div class="box">${luxRow}</div>
    </div>
    <!-- 右：冷氣 -->
    <div class="block">
      <span class="tab">冷氣</span>
      <div class="box">${tilesOf(acAll,"冷氣正常")}</div>
    </div>
    <!-- 左：冰箱 / 冷凍櫃 -->
    <div class="block">
      <span class="tab sm">冰箱</span> <span class="tab sm">冷凍櫃</span>
      <div class="box">${tilesOf(friAll,"冰箱正常")}
        ${freezerAll.length?`<div class="tiles" style="margin-top:6px">${freezerAll.map(tile).join("")}</div>`:''}</div>
    </div>
    <!-- 右：其他 -->
    <div class="block">
      <span class="tab">其他</span>
      <div class="box">${tilesOf(otherAll,"無其他項目")}</div>
    </div>
  </div>

  <!-- 處方 -->
  <div class="rx">
    ${rxCol(challenge,"self","我來挑戰")}
    ${rxCol(rescue,"pro","召喚救援")}
  </div>

  <div class="foot">
    <div class="it">📍 住商節電專案辦公室</div>
    <div class="it">☎ 082-321635</div>
    <div class="ver">v${esc(D.rule_version||"")}</div>
  </div>`;
  document.getElementById("sheet").innerHTML=html;
}

function getParam(n){return new URLSearchParams(location.search).get(n);}
function showBanner(t){document.getElementById("banner").innerHTML=`<div class="banner">${t}</div>`;}
function showError(t){document.getElementById("sheet").innerHTML=`<div class="state">⚠ ${esc(t||'載入失敗')}<br><small>請確認網址 token 與 API_BASE。</small></div>`;}
window.__onReport=function(data){ if(!data||data.error){showError(data&&data.error);return;} renderReport(data); };

(function load(){
  const token=getParam("token");
  if(!API_BASE||!token){
    renderReport(SAMPLE);
    showBanner(!API_BASE?"⚙ 範例資料（尚未設定 API_BASE）。設定後以 ?token=xxxx 開啟讀真實資料。":"範例資料：網址未帶 ?token=");
    return;
  }
  const s=document.createElement("script");
  s.src=API_BASE+(API_BASE.indexOf("?")>-1?"&":"?")+"token="+encodeURIComponent(token)+"&callback=__onReport";
  s.onerror=()=>showError("無法連線資料服務（API_BASE 或權限）");
  document.body.appendChild(s);
})();
</script>
